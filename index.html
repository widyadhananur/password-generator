<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Random Password Generator </title>
        <link rel="stylesheet" href="index.css">
    </head>

    <body> 
        <main class="container">
            <!-- Header Section -->
                <h1>Generate a <span>random password</span></h1>
                <p class="subtitle">Never use an insecure password again.</p>
            
            <!-- Generate Button -->
            <button id="generate-btn" class="generate-btn">Generate passwords</button>

            <hr>

            <!-- Password Display Button -->
            <div class="results">
                <div id="password-1" class="password-box"></div>
                <div id="password-2" class="password-box"></div>
            </div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
